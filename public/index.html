<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Perde</title>
<style>
:root{--bg:#000;--panel:#141414;--line:#2e2e2e;--text:#f3f3f3;--mute:#b3b3b3;--lamp:#ffc46b;--red:#e5050f;--err:#ff8a8a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 ui-sans-serif,-apple-system,"SF Pro Text",system-ui,sans-serif}
h1,h2,h3{font-family:ui-serif,"New York",Georgia,serif;font-weight:600;margin:0}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.45rem .9rem;cursor:pointer}
button:hover:not(:disabled){border-color:var(--lamp)}
button:disabled{opacity:.6;cursor:default}
button.primary{background:var(--lamp);color:#000;border-color:var(--lamp);font-weight:600}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
input,select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.5rem .7rem;width:100%}
code{font-size:.8rem;word-break:break-all}
header{display:flex;gap:1rem;align-items:center;padding:.8rem 1.5rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
header h1{font-size:1.5rem;color:var(--lamp);margin-right:.5rem}
nav{display:flex;gap:.3rem}
nav button{border:0;background:none;color:var(--mute);border-radius:0}
nav button.on{color:var(--text);box-shadow:inset 0 -2px var(--lamp)}
#q{max-width:320px;margin-left:auto}
main{padding:1.5rem;max-width:1500px;margin:auto}
section h2{margin:1.8rem 0 .8rem}
.mute{color:var(--mute)}.err{color:var(--err)}.pad{padding:1.5rem}

/* Afiş kartları */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1.2rem 1.1rem}
.card .pw{position:relative}
.pb{display:block;width:100%;padding:0;border:0;background:none;border-radius:6px;overflow:hidden}
.pb img,.ph{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--panel);border:1px solid rgba(255,255,255,.14);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.55)}
.add{position:absolute;top:.4rem;right:.4rem;width:2rem;height:2rem;padding:0;border-radius:50%;background:rgba(0,0,0,.78);color:#fff;border-color:rgba(255,255,255,.35);font-size:1.15rem;line-height:1;opacity:0;transition:opacity .15s}
.card:hover .add,.add:focus-visible,.add.on{opacity:1}
.add.on{background:var(--lamp);color:#000;border-color:var(--lamp)}
@media (hover:none){.add{opacity:1}}
.bar{height:4px;border-radius:2px;margin-top:.45rem}
.bar.has{background:var(--line)}
.bar i{display:block;height:100%;background:var(--red);border-radius:2px}
.nm{display:block;font-size:.88rem;margin-top:.3rem;line-height:1.3}
.card small{color:var(--mute)}

/* Paneller */
.sheet{position:fixed;inset:0;background:rgba(10,8,16,.8);display:none;z-index:10;overflow:auto;padding:2rem 1rem}
.sheet.open{display:block}
.box{background:var(--bg);border:1px solid var(--line);border-radius:12px;max-width:1200px;margin:auto;padding:1.5rem;position:relative}
.x{position:absolute;right:1rem;top:1rem}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2rem;margin-top:1.8rem}
@media (max-width:860px){.detail{grid-template-columns:1fr}}
.hero{display:flex;gap:1.2rem;margin-bottom:1rem}
.hero img{width:130px;border-radius:8px;align-self:flex-start}
.hero h2{font-size:1.7rem;line-height:1.2}
.chips{display:inline-flex;gap:.35rem;flex-wrap:wrap;vertical-align:middle}
.chip{border:1px solid var(--line);border-radius:99px;padding:0 .6rem;font-size:.82rem}
.info p{margin:.6rem 0}
.srcs{position:sticky;top:0;align-self:start;max-height:calc(100vh - 4rem);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem}
.srcs h3{margin-bottom:.6rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;margin:.7rem 0;align-items:center}
.list{display:grid;gap:.4rem}
.item{display:flex;justify-content:space-between;gap:1rem;text-align:left;width:100%}
.item small{color:var(--mute);white-space:nowrap}
.ep{display:grid;grid-template-columns:1fr auto}
.ep .bar{grid-column:1/-1;margin-top:.3rem}
.ep.sel{border-color:var(--lamp)}
.src{display:grid;gap:.2rem;text-align:left;width:100%;background:var(--bg)}
.s1{word-break:break-word}.s2{font-size:.8rem;color:var(--mute)}
.s3{display:flex;gap:.35rem;flex-wrap:wrap}
.tag{border:1px solid var(--lamp);color:var(--lamp);border-radius:99px;padding:0 .55rem;font-size:.75rem}
.tag.ok{border-color:#58c27d;color:#58c27d}.tag.q{border-color:var(--line);color:var(--mute)}

/* Oynatıcı */
#player{padding:1rem}
#player .box{padding:0;overflow:hidden;background:#000}
.ptop{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;padding:.7rem 1rem;background:var(--bg)}
.ptop .sp{flex:1}
#stage{background:#000}
#stage video{display:block;width:100%;height:76vh;background:#000}
#toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--lamp);padding:.5rem 1rem;border-radius:8px;display:none;z-index:20;max-width:90vw}
label{display:block;margin:.8rem 0 .2rem;color:var(--mute);font-size:.85rem}

/* ---- Duyarlı yerleşim (PC, tablet, telefon) ---- */
body.lock{overflow:hidden}
.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
header{padding-top:max(.8rem,env(safe-area-inset-top));padding-left:max(1.5rem,env(safe-area-inset-left));padding-right:max(1.5rem,env(safe-area-inset-right))}
#toast{bottom:max(1rem,env(safe-area-inset-bottom))}
@media (pointer:coarse){
  button{min-height:44px}
  .add{width:2.5rem;height:2.5rem}
  input,select{font-size:16px;min-height:44px}
}
@media (max-width:860px){
  .srcs{position:static;max-height:none}
}
@media (max-width:700px){
  header{gap:.5rem;padding:max(.6rem,env(safe-area-inset-top)) 1rem .6rem}
  header h1{font-size:1.3rem;margin-right:0}
  nav{margin-left:auto}
  #q{order:3;flex:1 1 100%;max-width:none;margin-left:0}
  main{padding:1rem}
  section h2{margin:1.2rem 0 .6rem;font-size:1.2rem}
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:.9rem .7rem}
  .nm{font-size:.8rem}
  .sheet{padding:0}
  .box{border-radius:0;border:0;min-height:100%;padding:3.6rem 1rem 2rem}
  .x{position:fixed;top:max(.6rem,env(safe-area-inset-top));right:.8rem;z-index:3;background:var(--bg)}
  .detail{margin-top:.4rem;gap:1.2rem}
  .hero{gap:.9rem}
  .hero img{width:96px}
  .hero h2{font-size:1.35rem}
  #player{background:#000}
  #player .box{padding:0;min-height:100%}
  .ptop{padding:.6rem .8rem;gap:.4rem;padding-top:max(.6rem,env(safe-area-inset-top))}
  #ptitle{flex:1 1 100%;font-size:.95rem}
  .ptop .sp{display:none}
  .ptop button{flex:1 1 auto;padding:.4rem .6rem;font-size:.85rem}
  #stage video{height:56.25vw}
}
@media (max-height:500px) and (orientation:landscape){
  #stage video{height:calc(100dvh - 56px)}
  .ptop{padding:.3rem .8rem}
  #ptitle{flex:1 1 auto}
}

/* ---- Oynatıcı kontrolleri ---- */
#fsbox{position:relative;background:#000}
#fsbox.fs{display:block;width:100%;height:100%}
#fsbox.fs #stage{position:absolute;inset:0}
#fsbox.fs #stage video{width:100%;height:100%}
#fsbox.fs .bars{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.88) 45%);transition:opacity .25s}
#fsbox.fs .ctl,#fsbox.fs .sbar{background:none;color:#fff}
#fsbox.fs.idle{cursor:none}
#fsbox.fs.idle .bars:not(:hover){opacity:0;pointer-events:none}
#stage{position:relative}
#stage.busy::after{content:'Hazırlanıyor…';position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);color:#fff;font-size:1.05rem;pointer-events:none}
#stage video{height:min(76vh,calc(100dvh - 210px))}
.ctl{display:flex;align-items:center;gap:.5rem;padding:.4rem .8rem;background:var(--bg)}
.ctl input[type=range]{flex:1;width:auto;padding:0;min-height:0;border:0;background:none;accent-color:var(--lamp)}
.ctl span{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--mute);font-size:.85rem}
.sbar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;padding:.5rem .8rem;background:var(--bg)}
.sbar label{display:inline;margin:0}
.sbar select{width:auto;max-width:min(300px,60vw)}
@media (max-width:700px){
  .ctl{flex-wrap:wrap}.ctl input[type=range]{order:5;flex:1 1 100%}
  #stage video{height:56.25vw}
}
@media (max-height:500px) and (orientation:landscape){#stage video{height:calc(100dvh - 150px)}}

/* Oynatıcı her zaman koyu tema (açık temada beyaz üstüne beyaz yazı olmasın) */
#player{--bg:#000;--panel:#141414;--line:#2e2e2e;--text:#f3f3f3;--mute:#b3b3b3;--lamp:#ffc46b;color:var(--text);color-scheme:dark}
#fsbox.fs button,#fsbox.fs select{background:rgba(38,35,47,.9);color:#fff;border-color:rgba(255,255,255,.28)}

/* ---- Başlık menüsü: geniş ekranda satır içi, telefonda açılır ---- */
.menu{display:contents}
header h1{order:0}nav{order:1}#q{order:2}#me{order:3}#logout{order:4}
#menuBtn{display:none;order:1;margin-left:auto;font-size:1.25rem;line-height:1;padding:.4rem .75rem}
@media (max-width:700px){
  #menuBtn{display:block}
  .menu{display:none;position:absolute;top:100%;left:0;right:0;z-index:6;flex-direction:column;align-items:stretch;gap:.4rem;background:var(--bg);border-bottom:1px solid var(--line);padding:.4rem 1rem 1rem;box-shadow:0 12px 24px rgba(0,0,0,.35)}
  .menu.open{display:flex}
  .menu nav{flex-direction:column;margin:0;order:0}
  .menu nav button{text-align:left;padding:.7rem .4rem;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none}
  .menu nav button.on{color:var(--lamp);box-shadow:none}
  .menu #me{order:1;padding:.4rem}
  .menu #logout{order:2}
  #q{order:2}
}
/* ---- Afiş: oynat / başlık: detay ---- */
.pb{position:relative}
.card.has-last .pb::after{content:'▶';position:absolute;inset:0;display:grid;place-items:center;font-size:2.4rem;color:#fff;background:rgba(0,0,0,.38);opacity:0;transition:opacity .15s}
.card.has-last:hover .pb::after,.card.has-last .pb:focus-visible::after{opacity:1}
.card.busy{opacity:.55;pointer-events:none}
.card button.nm{display:block;width:100%;min-height:0;text-align:left;background:none;border:0;border-radius:0;padding:0;margin-top:.3rem;font:inherit;font-size:.88rem;line-height:1.3;color:inherit;cursor:pointer}
.card button.nm:hover{text-decoration:underline;color:var(--lamp)}
@media (max-width:700px){.card button.nm{font-size:.8rem}}
@media (hover:none){.card.has-last .pb::after{opacity:1;inset:auto auto .4rem .4rem;width:1.9rem;height:1.9rem;border-radius:50%;background:rgba(0,0,0,.65);font-size:.85rem;padding-left:.1rem}}

/* ---- Netflix tarzı yatay satırlar (rail) ---- */
.rail{margin:1.4rem 0 .4rem}
.rail h3{font-family:ui-serif,"New York",Georgia,serif;font-size:1.15rem;margin:0 0 .5rem;padding-left:.2rem}
.railrow{display:flex;gap:.6rem;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;padding:.35rem .2rem 1rem;scroll-snap-type:x proximity}
.railrow::-webkit-scrollbar{display:none}
.railrow .card{flex:0 0 auto;width:158px;scroll-snap-align:start;transition:transform .18s ease}
.railrow .card:hover,.railrow .card:focus-within{transform:scale(1.06);z-index:2}
.railrow .pb img,.railrow .ph{aspect-ratio:2/3}
@media (max-width:700px){.railrow .card{width:112px}.rail h3{font-size:1.05rem}}

/* ---- Arama filtre menüsü ---- */
.fbar{display:flex;align-items:center;gap:.7rem;margin:.2rem 0 1rem;flex-wrap:wrap}
#fbtn.on{border-color:var(--lamp);color:var(--lamp)}
.fcount{display:inline-block;min-width:1.2rem;height:1.2rem;line-height:1.2;border-radius:99px;background:var(--lamp);color:#000;font-size:.72rem;font-weight:700;text-align:center;padding:0 .25rem;margin-left:.3rem;vertical-align:1px}
.fsort{margin-left:auto}
.fsort label{display:inline;margin:0 0 0 .3rem}
.fsort select{width:auto;padding:.35rem .5rem}
.fpanel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.9rem 1rem;margin-bottom:1rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.4rem 1.2rem}
.fgroup label.fl{margin:.5rem 0 .15rem}
.fpanel select{width:100%}
.fchips{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.2rem}
.fchip{padding:.3rem .75rem;border-radius:99px;font-size:.85rem;background:var(--bg)}
.fchip.on{background:var(--lamp);border-color:var(--lamp);color:#000;font-weight:600}
.ffoot{grid-column:1/-1;display:flex;gap:.6rem;align-items:center;margin-top:.4rem}
.fnote{font-size:.8rem}
@media (max-width:700px){.fpanel{grid-template-columns:1fr}.fsort{margin-left:0}}
</style>
</head>
<body>
<header>
  <h1>Perde</h1>
  <div class="menu" id="menu">
    <nav>
      <button data-v="home" class="on">Keşfet</button>
      <button data-v="lib">Kütüphanem</button>
      <button data-v="set">Hesabım</button>
      <button data-v="usr" id="navUsr" style="display:none">Kullanıcılar</button>
    </nav>
    <span id="me" class="mute"></span><button id="logout">Çıkış</button>
  </div>
  <input id="q" type="search" placeholder="Film veya dizi ara" aria-label="Ara">
  <button id="menuBtn" aria-label="Menü" aria-expanded="false" aria-controls="menu">☰</button>
</header>
<main id="main"></main>

<div class="sheet" id="detail"><div class="box" id="detailBox"></div></div>
<div class="sheet" id="player"><div class="box">
  <div class="ptop">
    <strong id="ptitle"></strong><span id="pinfo" class="mute"></span><span class="sp"></span>
    <button id="remux" style="display:none">Uyumluluk modu</button>
    <button id="iina">IINA'da aç</button><button id="vlc">VLC'de aç</button><button id="copy">Bağlantıyı kopyala</button><button id="closeP">Kapat</button>
  </div>
  <div id="fsbox">
    <div id="stage"></div>
    <div class="bars" id="bars">
      <div class="ctl" id="ctl" style="display:none">
        <button id="cPlay" aria-label="Oynat/Duraklat">▶</button><button id="cBack" aria-label="10 sn geri">−10</button><button id="cFwd" aria-label="10 sn ileri">+10</button>
        <input id="cSeek" type="range" min="0" max="1000" value="0" step="1" aria-label="Konum">
        <span id="cTime">0:00 / 0:00</span><button id="cMute">Ses</button><button id="cFs">Tam ekran</button>
      </div>
      <div class="sbar">
        <span id="audBox" style="display:none"><label for="audSel">Ses</label> <select id="audSel"></select></span>
        <span><label for="subSel">Altyazı</label> <select id="subSel"><option value="">Kapalı</option></select></span>
        <button id="sdm" title="Altyazıyı 0,5 sn geri al">−0,5 sn</button><button id="sdp" title="Altyazıyı 0,5 sn geciktir">+0,5 sn</button>
        <span id="subMsg" class="mute"></span>
      </div>
    </div>
  </div>
</div></div>
<div id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const CINE = 'https://v3-cinemeta.strem.io';
let cfg = {}, D = { library: [], progress: {} }, META = {}, view = 'home', redrawEps = null, saveT, curUrl = '', P = null, curState = null;

async function j(p, o) {
  const r = await fetch(p, o), d = await r.json().catch(() => ({}));
  if (r.status === 401) { location.href = '/login'; throw new Error('Giriş gerekli'); }
  if (!r.ok) throw new Error(typeof d.error === 'string' ? d.error : d.error?.message || 'İstek başarısız (' + r.status + ')');
  return d;
}
const post = (p, b) => j(p, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(b) });
const px = u => j('/api/proxy?url=' + encodeURIComponent(u));
let tt;
function toast(m, ms = 3500) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(tt); tt = setTimeout(() => t.style.display = 'none', ms); }
const sheet = (id, open) => { $(id).classList.toggle('open', open); if (open) $(id).scrollTop = 0; document.body.classList.toggle('lock', !!$('.sheet.open')); };
const saveData = () => { clearTimeout(saveT); saveT = setTimeout(() => post('/api/data', D).catch(() => {}), 600); };

// ---------- İzleme ilerlemesi ----------
const fOf = x => x && x.d ? Math.min(1, x.t / x.d) : 0;
function frac(id) {
  const p = D.progress[id]; if (!p) return 0;
  const v = Object.values(p.eps || {}); if (!v.length) return 0;
  if (p.type === 'series' && p.total) return Math.min(1, v.reduce((a, x) => a + (fOf(x) >= .92 ? 1 : fOf(x)), 0) / p.total);
  return fOf([...v].sort((a, b) => (b.u || 0) - (a.u || 0))[0]);
}
function refreshBars() {
  $$('.card').forEach(c => { c.classList.toggle('has-last', !!(cfg.addonSet && D.progress[c.dataset.id]?.last)); const f = frac(c.dataset.id), b = c.querySelector('.bar'); b.classList.toggle('has', f > 0); b.querySelector('i').style.width = Math.round(f * 100) + '%'; });
  if (redrawEps) redrawEps();
}

// ---------- Kütüphane (izleme listesi) ----------
const inLib = id => D.library.some(x => x.id === id);
function toggleLib(id) {
  const i = D.library.findIndex(x => x.id === id);
  if (i >= 0) D.library.splice(i, 1);
  else { const m = META[id]; if (!m) return; D.library.unshift({ id, type: m.type, name: m.name, poster: m.poster, imdb: m.imdb, imdbRating: m.imdbRating, year: m.year, releaseInfo: m.releaseInfo || m.year, genres: m.genres, addedAt: Date.now() }); }
  saveData();
  if (view === 'lib') { LIBR = D.library.map(x => META[x.id] || x); return renderView(); }
  const on = inLib(id);
  $$(`.card[data-id="${CSS.escape(id)}"] .add`).forEach(b => { b.classList.toggle('on', on); b.textContent = on ? '✓' : '+'; b.title = on ? 'Kütüphaneden çıkar' : 'Kütüphaneme ekle'; });
  const lb = $('#libBtn'); if (lb && lb.dataset.id === id) lb.textContent = on ? '✓ Kütüphanemde' : '+ Kütüphaneme ekle';
}

// ---------- Görünümler ----------
function setNav(v) { view = v; $$('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); }
$$('nav button').forEach(b => b.onclick = () => { $('#q').value = ''; ({ home, lib, set: settings, usr: usersView })[b.dataset.v](); });

// Filtreler arama kutusundan bağımsızdır: Keşfet ve Kütüphanem'de de geçerlidir, tercih olarak saklanır.
let gridHtml = '';
function pool() { return view === 'home' ? HOME : view === 'lib' ? LIBR : RESULTS; }
function renderGrid() { gridHtml = listHtml(applyFilters(pool())); }
function updateGridDom() {
  const g = $('#fgrid'); if (!g) return;
  g.innerHTML = gridHtml || '<p class="mute">Filtrelere uyan içerik yok. Filtreleri gevşetmeyi deneyin.</p>';
}
function card(m) {
  META[m.id] = m;
  const f = frac(m.id), on = inLib(m.id);
  const om = OSMETA[osKey(m)] || {};
  const rt = metaRate(m) || om.rating || 0;
  const sub = [m.releaseInfo || m.year, rt ? '★ ' + rt : ''].filter(Boolean).join(' · ');
  return `<div class="card${cfg.addonSet && D.progress[m.id]?.last ? ' has-last' : ''}" data-id="${esc(m.id)}" data-t="${esc(m.type)}"><div class="pw">
    <button class="pb" aria-label="${esc(m.name)}${cfg.addonSet && D.progress[m.id]?.last ? ' — kaldığınız yerden oynat' : ' — detayları aç'}" title="${cfg.addonSet && D.progress[m.id]?.last ? 'Kaldığınız yerden oynat' : 'Detayları aç'}">${m.poster ? `<img loading="lazy" referrerpolicy="no-referrer" src="${esc(m.poster)}" alt="">` : '<div class="ph"></div>'}</button>
    <button class="add${on ? ' on' : ''}" aria-label="Kütüphane" title="${on ? 'Kütüphaneden çıkar' : 'Kütüphaneme ekle'}">${on ? '✓' : '+'}</button></div>
    <div class="bar${f > 0 ? ' has' : ''}"><i style="width:${Math.round(f * 100)}%"></i></div>
    <button class="nm" title="Detayları aç">${esc(m.name)}</button><small>${esc(sub)}</small></div>`;
}
const grid = ms => `<div class="grid">${ms.map(card).join('')}</div>`;

const ENRICH = {};   // v3uid -> { imdb, imdbRating, year }

  const todo = list.filter(m => m.id && needMeta(m) && !(m.id in ENRICH)).map(m => ({ id: m.id, type: m.type }));

      const im = String(d.meta?.imdbRating || '').replace(',', '.');

    } catch { rec = { imdb: '', imdbRating: '', year: '' }; }

    if (start > 5) { st.want = start; st.wantDone = false; setTimeout(() => { st.wantDone = true; }, 10000); }   // doğrudan modda kaldığınız saniyeye atla
    v.addEventListener('error', () => toast('Tarayıcı bu dosyayı oynatamadı. “Uyumluluk modu”nu deneyin.', 8000));
    v.src = '/api/direct?t=' + url;                         // sunucu nihai adrese yönlendirir (video doğrudan CDN'den akar)
    post('/api/probe', { tok: url }).then(r => { if (P === st) { st.trueDur = r.duration || 0; fillTracks(st, r.audios, r.subs); } }).catch(() => { if (P === st) { st.embLoaded = true; autoSub(st); } });   // ffmpeg yoksa sessizce atlanır
    return;
  }
  try { await startSession(st, start, opt.aidx); }
  catch (e) { if (P === st) { st.switching = false; $('#stage').classList.remove('busy'); subMsg(e.message, true); toast(e.message, 8000); } }
}
function closePlayer() { stopPlayback(); sheet('#player', false); saveData(); refreshBars(); }

// --- Kontroller ---
let idleT;
const fsOn = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function wake() {
  const box = $('#fsbox'); box.classList.remove('idle'); clearTimeout(idleT);
  if (fsOn() && P && !P.el.paused) idleT = setTimeout(() => box.classList.add('idle'), 3000);
}
['mousemove', 'pointerdown', 'touchstart'].forEach(ev => $('#fsbox').addEventListener(ev, wake, { passive: true }));
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => { $('#fsbox').classList.toggle('fs', fsOn()); wake(); }));
function toggleFs() {
  const box = $('#fsbox'), fs = document.fullscreenElement || document.webkitFullscreenElement;
  if (fs) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  const req = box.requestFullscreen || box.webkitRequestFullscreen;
  if (req) req.call(box); else P?.el.webkitEnterFullscreen?.();
}
$('#cPlay').onclick = () => P && (P.el.paused ? P.el.play() : P.el.pause());
$('#cBack').onclick = () => P && seekTo(absT() - 10);
$('#cFwd').onclick = () => P && seekTo(absT() + 10);
$('#cMute').onclick = () => { if (P) { P.el.muted = !P.el.muted; $('#cMute').textContent = P.el.muted ? 'Sessiz' : 'Ses'; } };
$('#cFs').onclick = toggleFs;
$('#cSeek').oninput = e => { if (!P) return; P.drag = true; $('#cTime').textContent = fmt(e.target.value / 1000 * P.trueDur) + ' / ' + fmt(P.trueDur); };
$('#cSeek').onchange = e => { if (!P) return; P.drag = false; seekTo(e.target.value / 1000 * P.trueDur); };
$('#audSel').onchange = e => {
  const st = P; if (!st) return;
  const idx = +e.target.value, at = absT();
  if (st.sid) startSession(st, at, idx).catch(err => toast(err.message, 6000));
  else if (idx !== st.defAidx) openPlayer(st.url, st.ctx, st.s, true, { at, aidx: idx });   // doğrudan modda ses değişimi: uyumluluk moduna geç
};
$('#remux').onclick = () => curState && openPlayer(curState.url, curState.ctx, curState.s, true, { at: absT() });
window.addEventListener('pagehide', () => { if (P?.sid) stopSid(P.sid); });
document.addEventListener('keydown', e => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) && e.target.type !== 'range') return;
  const open = $('#player').classList.contains('open');
  if (e.key === 'Escape') {
    if (document.fullscreenElement || document.webkitFullscreenElement) return;
    if (open) return closePlayer();
    if ($('#detail').classList.contains('open')) sheet('#detail', false);
    return;
  }
  if (!open || !P || e.metaKey || e.ctrlKey || e.altKey) return;
  wake();
  if (e.key === ' ' && e.target.tagName !== 'BUTTON') { e.preventDefault(); P.el.paused ? P.el.play() : P.el.pause(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); seekTo(absT() - 10); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); seekTo(absT() + 10); }
  else if (e.key === 'f') toggleFs();
  else if (e.key === 'm') $('#cMute').click();
});
$('#closeP').onclick = closePlayer;
$('#iina').onclick = () => curUrl ? location.href = 'iina://weblink?url=' + encodeURIComponent(curUrl) : toast('Bağlantı hazırlanıyor, birkaç saniye sonra deneyin.');
const isMac = /Mac/.test(navigator.platform) && !(navigator.maxTouchPoints > 1);
if (!isMac) $('#iina').style.display = 'none';
$('#vlc').onclick = () => curUrl ? location.href = 'vlc://' + curUrl : toast('Bağlantı hazırlanıyor, birkaç saniye sonra deneyin.');
$('#copy').onclick = () => curUrl ? navigator.clipboard.writeText(curUrl).then(() => toast('Bağlantı kopyalandı')) : toast('Bağlantı hazırlanıyor, birkaç saniye sonra deneyin.');

// ---------- Hesap, ayarlar, kullanıcılar ----------
let me = null;
function settings() {
  setNav('set');
  const admin = me.role === 'admin';
  $('#main').innerHTML = `<div style="max-width:620px"><h2>Hesabım</h2>
    <p class="mute">${esc(me.name)} · ${admin ? 'Yönetici' : 'Kullanıcı'}</p>
    <label for="f_old">Mevcut parola</label><input id="f_old" type="password" autocomplete="current-password">
    <label for="f_new">Yeni parola (en az 6 karakter)</label><input id="f_new" type="password" autocomplete="new-password">
    <div class="row"><button id="chpw">Parolayı değiştir</button></div><p id="pres"></p>
    ${admin ? `<h2 style="margin-top:2rem">Sunucu ayarları</h2>
    <p class="mute">Bilgiler yalnızca bu bilgisayardaki config.json dosyasında saklanır ve tüm kullanıcılar için geçerlidir. Kullanıcılar bu adresleri göremez.</p>
    <label for="f_addon">Kaynak eklentisi (AIOStreams manifest adresi)</label><input id="f_addon" value="${esc(cfg.addon)}" placeholder="https://aiostreams.elfhosted.com/stremio/…/manifest.json" autocomplete="off">
    <label for="f_oskey">OpenSubtitles API anahtarı ${cfg.osSet ? '(kayıtlı)' : '(isteğe bağlı)'}</label><input id="f_oskey" type="password" placeholder="opensubtitles.com/consumers" autocomplete="off">
    <label for="f_osu">OpenSubtitles kullanıcı adı</label><input id="f_osu" value="${esc(cfg.osUser)}" autocomplete="off">
    <label for="f_osp">OpenSubtitles parolası</label><input id="f_osp" type="password" autocomplete="off" placeholder="${cfg.osSet ? '(kayıtlı)' : ''}">
    <label for="f_lang">Altyazı dilleri (virgülle)</label><input id="f_lang" value="${esc(cfg.langs)}" placeholder="tr,en">
    <div class="row"><button class="primary" id="save">Kaydet</button><button id="tAddon">Eklentiyi sına</button></div><p id="sres"></p>` : ''}</div>`;
  const out = (id, m, bad) => { $(id).textContent = m; $(id).className = bad ? 'err' : ''; };
  $('#chpw').onclick = async () => {
    try { await post('/api/me/password', { old: $('#f_old').value, pw: $('#f_new').value }); $('#f_old').value = $('#f_new').value = ''; out('#pres', 'Parola değiştirildi.'); }
    catch (e) { out('#pres', e.message, true); }
  };
  if (!admin) return;
  $('#save').onclick = async () => {
    try { cfg = { ...cfg, ...await post('/api/config', { addon: $('#f_addon').value, osKey: $('#f_oskey').value, osUser: $('#f_osu').value, osPass: $('#f_osp').value, langs: $('#f_lang').value }) }; toast('Kaydedildi'); settings(); }
    catch (e) { out('#sres', e.message, true); }
  };
  $('#tAddon').onclick = async () => {
    try { const m = await post('/api/addon/test', { url: $('#f_addon').value }); out('#sres', `Bağlandı: ${m.name || 'eklenti'} ${m.version || ''}`); }
    catch (e) { out('#sres', e.message, true); }
  };
}
async function usersView() {
  setNav('usr');
  $('#main').innerHTML = '<p class="mute">Yükleniyor…</p>';
  try {
    const list = await j('/api/users');
    $('#main').innerHTML = `<div style="max-width:720px"><h2>Kullanıcılar</h2>
      <p class="mute">Her kullanıcının kütüphanesi ve izleme ilerlemesi ayrıdır. Yalnızca güvendiğiniz kişileri ekleyin.</p>
      <div class="list" id="ulist">${list.map(u => `<div class="item" style="align-items:center;flex-wrap:wrap" data-id="${esc(u.id)}"><span><b>${esc(u.name)}</b> <small>${u.role === 'admin' ? 'Yönetici' : 'Kullanıcı'}${u.id === me.id ? ' · siz' : ''}</small></span>
        <span class="row" style="margin:0"><button data-a="pw">Parola belirle</button><button data-a="role">${u.role === 'admin' ? 'Kullanıcı yap' : 'Yönetici yap'}</button>${u.id === me.id ? '' : '<button data-a="del">Sil</button>'}</span></div>`).join('')}</div>
      <h3 style="margin-top:1.6rem">Yeni kullanıcı</h3>
      <label for="u_name">Kullanıcı adı</label><input id="u_name" autocomplete="off">
      <label for="u_pw">Parola (en az 6 karakter)</label><input id="u_pw" type="password" autocomplete="new-password">
      <label for="u_role">Rol</label><select id="u_role"><option value="user">Kullanıcı</option><option value="admin">Yönetici</option></select>
      <div class="row"><button class="primary" id="u_add">Ekle</button></div><p id="ures"></p></div>`;
    const err = e => { $('#ures').textContent = e.message; $('#ures').className = 'err'; };
    $('#u_add').onclick = () => post('/api/users', { name: $('#u_name').value, password: $('#u_pw').value, role: $('#u_role').value }).then(usersView).catch(err);
    $$('#ulist [data-a]').forEach(b => b.onclick = () => {
      const row = b.closest('[data-id]'), id = row.dataset.id, u = list.find(x => x.id === id);
      if (b.dataset.a === 'pw') { const pw = prompt(`${u.name} için yeni parola (en az 6 karakter):`); if (pw) post('/api/users/update', { id, password: pw }).then(() => toast('Parola değiştirildi')).catch(err); }
      else if (b.dataset.a === 'role') post('/api/users/update', { id, role: u.role === 'admin' ? 'user' : 'admin' }).then(usersView).catch(err);
      else if (confirm(`${u.name} silinsin mi? Kütüphanesi ve izleme geçmişi de silinir.`)) post('/api/users/delete', { id }).then(usersView).catch(err);
    });
  } catch (e) { $('#main').innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}
const menu = $('#menu'), menuBtn = $('#menuBtn');
const closeMenu = () => { menu.classList.remove('open'); menuBtn.setAttribute('aria-expanded', 'false'); };
menuBtn.onclick = e => { e.stopPropagation(); const o = menu.classList.toggle('open'); menuBtn.setAttribute('aria-expanded', String(o)); };
menu.addEventListener('click', e => { if (e.target.closest('button')) closeMenu(); });
document.addEventListener('click', e => { if (!e.target.closest('#menu, #menuBtn')) closeMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
const flushData = () => { if (!me) return; try { const b = new Blob([JSON.stringify(D)], { type: 'application/json' }); if (b.size < 60000) navigator.sendBeacon('/api/data', b); } catch {} };
document.addEventListener('visibilitychange', () => { if (document.hidden) flushData(); });
window.addEventListener('pagehide', flushData);
$('#logout').onclick = async () => { try { await post('/api/logout', {}); } catch {} location.href = '/login'; };

(async () => {
  [me, cfg, D] = await Promise.all([j('/api/me'), j('/api/config'), j('/api/data')]);
  D.library = D.library || []; D.progress = D.progress || {};
  $('#me').textContent = me.name; $('#navUsr').style.display = me.role === 'admin' ? '' : 'none';
  // Kaydedilmiş filtre tercihini yükle (localStorage'dan; yoksa kullanıcı verısından)
  try {
    const p = await j('/api/prefs');
    if (!localStorage.getItem(FKEY) && p && p.filters && typeof p.filters === 'object') FILTERS = { ...FDEF(), ...p.filters, genres: Array.isArray(p.filters.genres) ? p.filters.genres : [] };
  } catch {}
  (cfg.addonSet || me.role !== 'admin') ? home() : settings();
})();
</script>
