<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Perde</title>
<script>(function(){var w=innerWidth,h=innerHeight;var tv=(w>=1200&&h/w>=1.6)||(navigator.userAgent||'').indexOf('Android TV')>-1||(navigator.userAgent||'').indexOf('GoogleTV')>-1;if(tv)document.documentElement.classList.add('tv');})();</script>
<style>
:root{--bg:#000;--panel:#141414;--line:#2e2e2e;--text:#f3f3f3;--mute:#b3b3b3;--lamp:#ffc46b;--red:#e5050f;--err:#ff8a8a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 ui-sans-serif,-apple-system,"SF Pro Text",system-ui,sans-serif}
h1,h2,h3{font-family:ui-serif,"New York",Georgia,serif;font-weight:600;margin:0}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.45rem .9rem;cursor:pointer}
button:hover:not(:disabled){border-color:var(--lamp)}
button:disabled{opacity:.6;cursor:default}
button.primary{background:var(--lamp);color:#000;border-color:var(--lamp);font-weight:600}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
input,select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.5rem .7rem;width:100%}
code{font-size:.8rem;word-break:break-all}
header{display:flex;gap:1rem;align-items:center;padding:.8rem 1.5rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
header h1{font-size:1.5rem;color:var(--lamp);margin-right:.5rem}
nav{display:flex;gap:.3rem}
nav button{border:0;background:none;color:var(--mute);border-radius:0}
nav button.on{color:var(--text);box-shadow:inset 0 -2px var(--lamp)}
#q{max-width:320px;margin-left:auto}
main{padding:1.5rem;max-width:1500px;margin:auto}
section h2{margin:1.8rem 0 .8rem}
.mute{color:var(--mute)}.err{color:var(--err)}.pad{padding:1.5rem}

/* Afiş kartları */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1.2rem 1.1rem}
.card .pw{position:relative}
.pb{display:block;width:100%;padding:0;border:0;background:none;border-radius:6px;overflow:hidden}
.pb img,.ph{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--panel);border:1px solid rgba(255,255,255,.14);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.55)}
.add{position:absolute;top:.4rem;right:.4rem;width:2rem;height:2rem;padding:0;border-radius:50%;background:rgba(0,0,0,.78);color:#fff;border-color:rgba(255,255,255,.35);font-size:1.15rem;line-height:1;opacity:0;transition:opacity .15s}
.card:hover .add,.add:focus-visible,.add.on{opacity:1}
.add.on{background:var(--lamp);color:#000;border-color:var(--lamp)}
@media (hover:none){.add{opacity:1}}
.bar{height:4px;border-radius:2px;margin-top:.45rem}
.bar.has{background:var(--line)}
.bar i{display:block;height:100%;background:var(--red);border-radius:2px}
.nm{display:block;font-size:.88rem;margin-top:.3rem;line-height:1.3}
.card small{color:var(--mute)}

/* Paneller */
.sheet{position:fixed;inset:0;background:rgba(10,8,16,.8);display:none;z-index:10;overflow:auto;padding:2rem 1rem}
.sheet.open{display:block}
.box{background:var(--bg);border:1px solid var(--line);border-radius:12px;max-width:1200px;margin:auto;padding:1.5rem;position:relative}
.x{position:absolute;right:1rem;top:1rem}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2rem;margin-top:1.8rem}
@media (max-width:860px){.detail{grid-template-columns:1fr}}
.hero{display:flex;gap:1.2rem;margin-bottom:1rem}
.hero img{width:130px;border-radius:8px;align-self:flex-start}
.hero h2{font-size:1.7rem;line-height:1.2}
.chips{display:inline-flex;gap:.35rem;flex-wrap:wrap;vertical-align:middle}
.chip{border:1px solid var(--line);border-radius:99px;padding:0 .6rem;font-size:.82rem}
.info p{margin:.6rem 0}
.srcs{position:sticky;top:0;align-self:start;max-height:calc(100vh - 4rem);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem}
.srcs h3{margin-bottom:.6rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;margin:.7rem 0;align-items:center}
.list{display:grid;gap:.4rem}
.item{display:flex;justify-content:space-between;gap:1rem;text-align:left;width:100%}
.item small{color:var(--mute);white-space:nowrap}
.ep{display:grid;grid-template-columns:1fr auto}
.ep .bar{grid-column:1/-1;margin-top:.3rem}
.ep.sel{border-color:var(--lamp)}
.src{display:grid;gap:.2rem;text-align:left;width:100%;background:var(--bg)}
.s1{word-break:break-word}.s2{font-size:.8rem;color:var(--mute)}
.s3{display:flex;gap:.35rem;flex-wrap:wrap}
.tag{border:1px solid var(--lamp);color:var(--lamp);border-radius:99px;padding:0 .55rem;font-size:.75rem}
.tag.ok{border-color:#58c27d;color:#58c27d}.tag.q{border-color:var(--line);color:var(--mute)}

/* Oynatıcı — Prime Video benzeri sade, tam ekran katman */
#player{padding:0;background:#000}
#player .box{padding:0;border:0;border-radius:0;max-width:none;margin:0;min-height:100dvh;height:100dvh;background:#000;display:flex;flex-direction:column}
#stage{background:#000;flex:1;min-height:0}
#stage video{display:block;width:100%;height:100%;background:#000}
#toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--lamp);padding:.5rem 1rem;border-radius:8px;display:none;z-index:20;max-width:90vw}
label{display:block;margin:.8rem 0 .2rem;color:var(--mute);font-size:.85rem}

/* ---- Duyarlı yerleşim (PC, tablet, telefon) ---- */
body.lock{overflow:hidden}
.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
header{padding-top:max(.8rem,env(safe-area-inset-top));padding-left:max(1.5rem,env(safe-area-inset-left));padding-right:max(1.5rem,env(safe-area-inset-right))}
#toast{bottom:max(1rem,env(safe-area-inset-bottom))}
@media (pointer:coarse){
  button{min-height:44px}
  .add{width:2.5rem;height:2.5rem}
  input,select{font-size:16px;min-height:44px}
}
@media (max-width:860px){
  .srcs{position:static;max-height:none}
}
@media (max-width:700px){
  header{gap:.5rem;padding:max(.6rem,env(safe-area-inset-top)) 1rem .6rem}
  header h1{font-size:1.3rem;margin-right:0}
  nav{margin-left:auto}
  #q{order:3;flex:1 1 100%;max-width:none;margin-left:0}
  main{padding:1rem}
  section h2{margin:1.2rem 0 .6rem;font-size:1.2rem}
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:.9rem .7rem}
  .nm{font-size:.8rem}
  .sheet{padding:0}
  .box{border-radius:0;border:0;min-height:100%;padding:3.6rem 1rem 2rem}
  .x{position:fixed;top:max(.6rem,env(safe-area-inset-top));right:.8rem;z-index:3;background:var(--bg)}
  .detail{margin-top:.4rem;gap:1.2rem}
  .hero{gap:.9rem}
  .hero img{width:96px}
  .hero h2{font-size:1.35rem}
  #player{background:#000}
  #player .box{padding:0;min-height:100dvh;height:100dvh}
  .otop{padding:.5rem .7rem;gap:.35rem;padding-top:max(.5rem,env(safe-area-inset-top))}
  .otitle strong{font-size:.95rem}
  .obig button{width:3.4rem;height:3.4rem;font-size:1.6rem}
  .obot{padding:.5rem .8rem max(.7rem,env(safe-area-inset-bottom))}
  .orow button:not(#cMute){display:none}
}
@media (max-height:500px) and (orientation:landscape){
  .otop{padding:.25rem .7rem}
  .otitle{flex:1 1 auto}
}

/* ---- Oynatıcı kontrolleri: videonun üstünde katman (Prime Video benzeri) ---- */
#fsbox{position:relative;background:#000;flex:1;min-height:0;display:flex;flex-direction:column}
.ovl{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;pointer-events:none;transition:opacity .25s}
.ovl > *{pointer-events:auto}
#fsbox.idle .ovl:not(:hover):not(.show){opacity:0;pointer-events:none}
#fsbox.idle{cursor:none}
/* oynatıcı kapalıyken overlay tıklamaları yutmasın (sayfa "donmuş" gibi görünmesin) */
#player:not(.open) .ovl{opacity:0!important;pointer-events:none!important}
.otop{display:flex;align-items:center;gap:.7rem;padding:.7rem 1rem;background:linear-gradient(rgba(0,0,0,.78),transparent)}
.otitle{display:flex;align-items:baseline;gap:.6rem;min-width:0}
.otitle strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1.05rem}
.otitle span{white-space:nowrap;font-size:.8rem}
.sp{flex:1}
.ogroup{position:relative}
.ovl button{background:rgba(20,20,20,.55);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:8px;min-width:2.4rem}
.ovl button:hover{background:rgba(40,40,40,.85);border-color:var(--lamp)}
.ovl button.on{border-color:var(--lamp);background:rgba(60,50,30,.9)}
select.pop{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.popwrap{position:absolute;top:calc(100% + .5rem);right:0;z-index:8;opacity:0;transform:translateY(-4px);transition:opacity .15s,transform .15s}
.popwrap.open{opacity:1;transform:none}
/* Altyazı/ses menüsü: sabit genişlik + satır başına en fazla 2 satır (kelime sınırında kırma), yalnız dikey kaydırma — yatay taşma yok, uzun listede okunurluk korunur */
.poplist{display:flex;flex-direction:column;gap:0;background:rgba(12,12,12,.97);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:.3rem;max-height:min(52vh,22rem);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;width:min(19rem,calc(100vw - 2rem));scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.3) transparent;-webkit-overflow-scrolling:touch}
.poplist::-webkit-scrollbar{width:6px}
.poplist::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:3px}
.poplist button{display:flex;align-items:center;gap:.45rem;text-align:left;background:none;border:0;border-radius:6px;padding:.4rem .55rem;margin:1px 0;font-size:.86rem;line-height:1.3;min-height:2rem;max-width:100%;min-width:0}
.poplist button .lbl{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;hyphens:auto}
.poplist button .tick{flex:none;width:.9rem;color:var(--lamp);font-weight:700}
.poplist button:hover{background:rgba(255,255,255,.12);border:0}
.poplist button.sel{color:var(--lamp)}
.poplist button.nudge{color:#9ecbff}
.poplist .sep{height:1px;background:rgba(255,255,255,.14);margin:.3rem .35rem;flex:none}
.poplist .phd{font-size:.68rem;color:#9a9a9a;text-transform:uppercase;letter-spacing:.05em;padding:.35rem .55rem .12rem;flex:none;position:sticky;top:0;background:rgba(12,12,12,.97);z-index:1}
@media (max-width:700px){
  .poplist{width:min(17rem,calc(100vw - 1.5rem));max-height:min(46vh,17rem)}
  .poplist button{font-size:.92rem;padding:.5rem .6rem}
}
.obig{margin-top:auto;margin-bottom:auto;display:flex;justify-content:center;align-items:center;gap:1.6rem;pointer-events:none}
.obig button{width:3.2rem;height:3.2rem;border-radius:50%;font-size:1.5rem;line-height:1;display:grid;place-items:center;pointer-events:auto;background:rgba(20,20,20,.62);backdrop-filter:blur(4px)}
.obig button:hover{background:rgba(45,45,45,.9)}
#cPlay{width:4.2rem;height:4.2rem;font-size:1.7rem}
.obot{padding:.6rem 1rem calc(.8rem + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.82) 55%)}
.orow{display:flex;align-items:center;gap:.7rem;margin-top:.35rem}
.orow .sp{flex:1}
input[type=range]#cSeek{width:100%;padding:0;min-height:0;border:0;background:none;accent-color:var(--lamp);height:1.2rem;cursor:pointer}
#cTime{font-variant-numeric:tabular-nums;white-space:nowrap;color:#ddd;font-size:.85rem}
/* Mobil: üç büyük buton oynatıcının tam ortasında (.obig zaten ortalar); sağ-üst grup aynı kalır */
@media (max-width:700px){
  .ovl{top:auto;height:auto}
  .otop{position:fixed;left:0;right:0;top:0}
  .obig{position:fixed;inset:0;display:grid;place-items:center;margin:0;gap:0}
  .obig button{position:absolute;top:50%;left:50%;translate:-50% -50%}
  #cBack{translate:calc(-50% - 4.6rem) -50%}
  #cFwd{translate:calc(-50% + 4.6rem) -50%}
  .obot{position:fixed;left:0;right:0;bottom:0}
}
@media (max-height:500px) and (orientation:landscape){
  .obig button{width:2.6rem;height:2.6rem;font-size:1.25rem}
  #cPlay{width:3.4rem;height:3.4rem}
}

/* Oynatıcı her zaman koyu tema (açık temada beyaz üstüne beyaz yazı olmasın) */
#player{--bg:#000;--panel:#141414;--line:#2e2e2e;--text:#f3f3f3;--mute:#b3b3b3;--lamp:#ffc46b;color:var(--text);color-scheme:dark}

/* ---- Başlık menüsü: geniş ekranda satır içi, telefonda açılır ---- */
.menu{display:contents}
header h1{order:0}nav{order:1}#q{order:2}#me{order:3}#logout{order:4}
#menuBtn{display:none;order:1;margin-left:auto;font-size:1.25rem;line-height:1;padding:.4rem .75rem}
@media (max-width:700px){
  #menuBtn{display:block}
  .menu{display:none;position:absolute;top:100%;left:0;right:0;z-index:6;flex-direction:column;align-items:stretch;gap:.4rem;background:var(--bg);border-bottom:1px solid var(--line);padding:.4rem 1rem 1rem;box-shadow:0 12px 24px rgba(0,0,0,.35)}
  .menu.open{display:flex}
  .menu nav{flex-direction:column;margin:0;order:0}
  .menu nav button{text-align:left;padding:.7rem .4rem;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none}
  .menu nav button.on{color:var(--lamp);box-shadow:none}
  .menu #me{order:1;padding:.4rem}
  .menu #logout{order:2}
  #q{order:2}
}
/* ---- Afiş: oynat / başlık: detay ---- */
.pb{position:relative}
.card.has-last .pb::after{content:'▶';position:absolute;inset:0;display:grid;place-items:center;font-size:2.4rem;color:#fff;background:rgba(0,0,0,.38);opacity:0;transition:opacity .15s}
.card.has-last:hover .pb::after,.card.has-last .pb:focus-visible::after{opacity:1}
.card.busy{opacity:.55;pointer-events:none}
.card button.nm{display:block;width:100%;min-height:0;text-align:left;background:none;border:0;border-radius:0;padding:0;margin-top:.3rem;font:inherit;font-size:.88rem;line-height:1.3;color:inherit;cursor:pointer}
.card button.nm:hover{text-decoration:underline;color:var(--lamp)}
@media (max-width:700px){.card button.nm{font-size:.8rem}}
@media (hover:none){.card.has-last .pb::after{opacity:1;inset:auto auto .4rem .4rem;width:1.9rem;height:1.9rem;border-radius:50%;background:rgba(0,0,0,.65);font-size:.85rem;padding-left:.1rem}}

/* ---- Keşfet: Filmler / Diziler sekmeleri ---- */
.tabs{display:flex;gap:.4rem;margin:.2rem 0 1rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{background:none;border:0;border-radius:0;color:var(--mute);padding:.5rem .9rem;cursor:pointer;font-size:.95rem}
.tab:hover:not(:disabled){border-color:transparent;color:var(--text)}
.tab.on{color:var(--text);font-weight:600;box-shadow:inset 0 -2px var(--lamp)}
.tab small{color:var(--mute);font-weight:400}

/* ---- Netflix tarzı yatay satırlar (rail) ---- */
.rail{margin:1.4rem 0 .4rem}
.rail h3{font-family:ui-serif,"New York",Georgia,serif;font-size:1.15rem;margin:0 0 .5rem;padding-left:.2rem}
.railrow{display:flex;gap:.6rem;overflow-x:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x overscroll-contain;overscroll-behavior-x:contain;scrollbar-width:none;padding:.35rem .2rem 1rem}
.railrow::-webkit-scrollbar{display:none}
.rhead{display:flex;align-items:center;gap:.5rem}
.rhead h3{margin-bottom:.5rem}
/* Yalnızca kategori başlığının karşısında, yan yana 2 kaydırma düğmesi */
.rnav{margin-left:auto;display:flex;gap:.35rem}
.rnav button{width:2.1rem;height:2.1rem;border-radius:99px;border:1px solid var(--line);background:rgba(20,20,20,.85);color:#f3f3f3;font-size:1.05rem;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer;transition:background .15s ease,border-color .15s ease,transform .12s ease}
.rnav button:hover{background:#2a2a2a;border-color:#555}
.rnav button:active{transform:scale(.92)}
@media (max-width:700px){.rnav button{width:1.7rem;height:1.7rem;font-size:.9rem}}
.railrow .card{flex:0 0 auto;width:158px;transition:transform .18s ease}
.railrow .card img{pointer-events:none;-webkit-user-drag:none;user-select:none}
.railrow .card:hover,.railrow .card:focus-within{transform:scale(1.06);z-index:2}
.railrow .pb img,.railrow .ph{aspect-ratio:2/3}
@media (max-width:700px){.railrow .card{width:112px}.rail h3{font-size:1.05rem}}

/* ---- Arama filtre menüsü ---- */
.fbar{display:flex;align-items:center;gap:.7rem;margin:.2rem 0 1rem;flex-wrap:wrap}
#fbtn.on{border-color:var(--lamp);color:var(--lamp)}
.fcount{display:inline-block;min-width:1.2rem;height:1.2rem;line-height:1.2;border-radius:99px;background:var(--lamp);color:#000;font-size:.72rem;font-weight:700;text-align:center;padding:0 .25rem;margin-left:.3rem;vertical-align:1px}
.fsort{margin-left:auto;display:inline-flex;align-items:center}
.fsort label{display:inline;margin:0 .5rem 0 0}   /* etiket ile dropdown arasında boşluk */
.fsort select{width:auto;padding:.35rem .5rem}
.fsort + .fsort{margin-left:.9rem}                /* iki dropdown grubu arası ayrım */
.fpanel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.9rem 1rem;margin-bottom:1rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.4rem 1.2rem}
.fgroup label.fl{margin:.5rem 0 .15rem}
.fpanel select{width:100%}
.fchips{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.2rem}
.fchip{padding:.3rem .75rem;border-radius:99px;font-size:.85rem;background:var(--bg)}
.fchip.on{background:var(--lamp);border-color:var(--lamp);color:#000;font-weight:600}
.ffoot{grid-column:1/-1;display:flex;gap:.6rem;align-items:center;margin-top:.4rem}
.fnote{font-size:.8rem}
@media (max-width:700px){.fpanel{grid-template-columns:1fr}.fsort{margin-left:0}}

/* ---- Android TV / 10-foot modu ---- */
html.tv{font-size:18px}
html.tv body{zoom:1.25}
html.tv header,html.tv main{padding-left:3.5vw;padding-right:3.5vw}
html.tv #q{max-width:420px}
html.tv .card{width:clamp(220px,17vw,290px)}
html.tv .rhead h3{font-size:1.4rem}
html.tv .tab,html.tv nav button{padding:.6rem 1.2rem;font-size:1.05rem}
html.tv .rnav button{width:3rem;height:3rem;font-size:1.5rem}
html.tv button:focus-visible,html.tv input:focus-visible,html.tv select:focus-visible{outline:4px solid var(--lamp);outline-offset:4px;box-shadow:0 0 24px rgba(255,196,107,.45)}
html.tv :focus:not(:focus-visible){outline:none}
html.tv .tvhide{display:none!important}
html.tv .railrow{scrollbar-width:none}
html.tv .railrow::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<header>
  <h1>Perde</h1>
  <div class="menu" id="menu">
    <nav>
      <button data-v="home" class="on">Keşfet</button>
      <button data-v="lib">Kütüphanem</button>
      <button data-v="set">Hesabım</button>
      <button data-v="usr" id="navUsr" style="display:none">Kullanıcılar</button>
    </nav>
    <span id="me" class="mute"></span><button id="logout">Çıkış</button>
  </div>
  <input id="q" type="search" placeholder="Film veya dizi ara" aria-label="Ara" autocomplete="off" autoclose="off" autocapitalize="none" autocorrect="off" spellcheck="false">
  <button id="menuBtn" aria-label="Menü" aria-expanded="false" aria-controls="menu">☰</button>
</header>
<main id="main"></main>

<div class="sheet" id="detail"><div class="box" id="detailBox"></div></div>
<div class="sheet" id="player"><div class="box">
  <div id="fsbox">
    <div id="stage"></div>
    <div class="ovl" id="ovl">
      <div class="otop">
        <button id="closeP" aria-label="Kapat">✕</button>
        <div class="otitle"><strong id="ptitle"></strong><span id="pinfo" class="mute"></span></div>
        <span class="sp"></span>
        <div class="ogroup" id="audBox" style="display:none"><button id="audBtn" aria-label="Ses">🔊</button><select id="audSel" class="pop" aria-label="Ses parçası"></select></div>

<script>
const $ = s => document.querySelector(s), $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const CINE = 'https://v3-cinemeta.strem.io';
let cfg = {}, D = { library: [], progress: {} }, META = {}, view = 'home', redrawEps = null, saveT, curUrl = '', P = null, curState = null;

async function j(p, o) {
  const r = await fetch(p, o), d = await r.json().catch(() => ({}));

}
const post = (p, b) => j(p, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(b) });
const px = u => j('/api/proxy?url=' + encodeURIComponent(u));
let tt;
function toast(m, ms = 3500) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(tt); tt = setTimeout(() => t.style.display = 'none', ms); }
const sheet = (id, open) => { $(id).classList.toggle('open', open); if (open) $(id).scrollTop = 0; document.body.classList.toggle('lock', !!$('.sheet.open')); if (open && tvMode()) setTimeout(() => { const f = $(id).querySelector('.box button:not([disabled])'); if (f) f.focus({ preventScroll: true }); }, 80); };
let lastSynced = 0;                                        // en son sunucu eşitleme anı (zaman damgası)
const saveData = () => { clearTimeout(saveT); saveT = setTimeout(() => post('/api/data', D).catch(() => {}), 600); };
// Kalıcı ve anında ilerleme yazımı: fetch keepalive, sekmeyi yenileme/kapama anında da sunucuya ulaşır
// (sendBeacon Safari'de JSON blob'u kabul etmiyor; debounce'lu tam POST ise kapanışta yarıda kalabiliyordu).
const persistNow = async () => {
  if (!me) return;

};
// Cihazlar arası ilerleme çakışması: aynı içerik iki cihazda açılıp sırayla kapatıldığında,
// eski bir sekmenin gecikmeli kaydı yeni konumu ezmesin → her kayıtten önce sunucudaki taze hali oku.
const syncProgress = async id => {
  if (!id || !me) return;
  try {
    const fresh = await j('/api/progress?id=' + encodeURIComponent(id));
    const cur = D.progress[id];
    if (fresh && typeof fresh === 'object' && (!cur || (fresh.u || 0) >= (cur.u || 0))) D.progress[id] = fresh;   // sunucudaki daha yeni kayıt kazanır

};

// ---------- İzleme ilerlemesi ----------
const fOf = x => x && x.d ? Math.min(1, x.t / x.d) : 0;
function frac(id) {
  const p = D.progress[id]; if (!p) return 0;
  const v = Object.values(p.eps || {}); if (!v.length) return 0;
  if (p.type === 'series' && p.total) return Math.min(1, v.reduce((a, x) => a + (fOf(x) >= .92 ? 1 : fOf(x)), 0) / p.total);
  return fOf([...v].sort((a, b) => (b.u || 0) - (a.u || 0))[0]);
}
function refreshBars() {
  $$('.card').forEach(c => { c.classList.toggle('has-last', !!(cfg.addonSet && D.progress[c.dataset.id]?.last)); const f = frac(c.dataset.id), b = c.querySelector('.bar'); b.classList.toggle('has', f > 0); b.querySelector('i').style.width = Math.round(f * 100) + '%'; });
  if (redrawEps) redrawEps();
}

// ---------- Kütüphane (izleme listesi) ----------
const inLib = id => D.library.some(x => x.id === id);
function toggleLib(id) {
  const i = D.library.findIndex(x => x.id === id);
  if (i >= 0) D.library.splice(i, 1);
  else { const m = META[id]; if (!m) return; D.library.unshift({ id, type: m.type, name: m.name, poster: m.poster, imdb: m.imdb, imdbRating: m.imdbRating, year: m.year, releaseInfo: m.releaseInfo || m.year, genres: m.genres, addedAt: Date.now() }); }
  saveData();
  if (view === 'lib') { LIBR = D.library.map(x => META[x.id] || x); return renderView(); }
  const on = inLib(id);
  $$(`.card[data-id="${CSS.escape(id)}"] .add`).forEach(b => { b.classList.toggle('on', on); b.textContent = on ? '✓' : '+'; b.title = on ? 'Kütüphaneden çıkar' : 'Kütüphaneme ekle'; });
  const lb = $('#libBtn'); if (lb && lb.dataset.id === id) lb.textContent = on ? '✓ Kütüphanemde' : '+ Kütüphaneme ekle';
}

// ---------- Görünümler ----------
function setNav(v) { view = v; $$('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); }
$$('nav button').forEach(b => b.onclick = () => { $('#q').value = ''; ({ home, lib, set: settings, usr: usersView })[b.dataset.v](); });

let gridHtml = '';
function pool() { return view === 'home' ? HOME : view === 'lib' ? LIBR : RESULTS; }
function renderGrid() { gridHtml = listHtml(applyFilters(pool())); }
function updateGridDom() {

}
function card(m) {

    <div class="bar${f > 0 ? ' has' : ''}"><i style="width:${Math.round(f * 100)}%"></i></div>

}
const grid = ms => `<div class="grid">${ms.map(card).join('')}</div>`;
// Netflix tarzı: içeriği kategoriye (türüne) göre gruplayıp yatay kaydırılabilir satırlar halinde gösterir.
const RAIL_CHUNK = 18;
const chunkList = (arr, n) => { const out = []; for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n)); return out; };
const railSec = (title, ms) => `<section class="rail">
  <div class="rhead"><h3>${esc(title)}</h3><span class="rnav"><button data-dir="-1" aria-label="${esc(title)} satırında geri kaydır">‹</button><button data-dir="1" aria-label="${esc(title)} satırında ileri kaydır">›</button></span></div>
  <div class="railrow">${ms.map(card).join('')}</div>
</section>`;
function railsHtml(ms) {
  // Keşfet: her zaman kategori başlıklı satırlar (Aksiyon, Komedi...). Sıralama yalnızca satır içi öğeleri etkiler.
  if (view === 'home') {
    if (!CATALOG.loaded) return grid(ms);   // katalog henüz yüklenmediyse düz liste ile bekle
    let html = '';
    for (const g of railRows(CATALOG.tab)) html += railSec(g.title, g.ms);
    return html;
  }
  // Kütüphanem: tür bazlı gruplar (Filmler/Diziler)
  let html = '';
  for (const [t, label] of [['movie', 'Filmler'], ['series', 'Diziler']]) {
    const g = ms.filter(m => m.type === t);
    if (!g.length) continue;
    html += railSec(label, g);

const isRailView = () => view === 'home' || view === 'lib';
const listHtml = ms => isRailView() ? railsHtml(ms) : grid(ms);

/* ---- Android TV: kumanda (D-pad) ile odak gezinme ---- */
const TV_NAVSEL = ['button:not(:disabled)', 'input', 'select', 'textarea', 'a[href]', '.card'].join(',');
const tvMode = () => document.documentElement.classList.contains('tv') || matchMedia('(pointer:coarse)').matches;
let tvActive = false;                       // kullanıcı gerçekten kumandayla geziniyor mu
function tvFocusables() { return [...document.querySelectorAll(TV_NAVSEL)].filter(el => el.offsetParent !== null && !el.closest('[hidden]')); }
function tvCenter(el) { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
function tvMove(dir) {
  const cur = document.activeElement && document.activeElement.matches ? document.activeElement : null;
  const list = tvFocusables(); if (!list.length) return;
  let best = null, bestScore = Infinity;
  if (!cur || !list.includes(cur)) { (dir === 'L' || dir === 'U' ? list[0] : list[list.length - 1]).focus(); return true; }
  const [cx, cy] = tvCenter(cur);
  for (const el of list) {
    if (el === cur) continue;
    const [x, y] = tvCenter(el); const dx = x - cx, dy = y - cy;
    let along, cross;
    if (dir === 'L') { along = -dx; cross = Math.abs(dy); }
    else if (dir === 'R') { along = dx; cross = Math.abs(dy); }
    else if (dir === 'U') { along = -dy; cross = Math.abs(dx); }
    else { along = dy; cross = Math.abs(dx); }
    if (along < 6) continue;                // yalnızca hedef yöndeki öğeler
    const score = along + cross * 3;        // hafif diyagonal sapma cezalı
    if (score < bestScore) { bestScore = score; best = el; }
  }
  if (best) { best.focus({ preventScroll: true }); best.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' }); return true; }
  return false;                             // bu yönde gidecek yer yok
}
window.addEventListener('keydown', e => {
  const K = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D' }[e.key];
  if (!K || e.metaKey || e.ctrlKey || e.altKey) return;
  const ae = document.activeElement;
  const inField = ae && /INPUT|SELECT|TEXTAREA/.test(ae.tagName) && !(ae.type === 'range' || ae.type === 'search' || ae.type === 'checkbox');
  if (inField) return;                      // yazı alanlarında ok tuşları normal çalışsın
  if (!tvActive && !tvMode()) return;       // fare/klavye kullanıcılarına dokunma
  const moved = tvMove(K);
  if (!moved) {
    const row = ae && ae.closest('.railrow');
    if (row && (K === 'L' || K === 'R')) { row.scrollBy({ left: (K === 'R' ? 1 : -1) * Math.max(240, row.clientWidth * .85), behavior: 'smooth' }); e.preventDefault(); return; }
    return;                                 // hiçbiri: tarayıcı varsayılanına bırak
  }
  e.preventDefault();
}, true);
window.addEventListener('keyup', e => {
  if (e.key === 'Enter' && tvActive) {
    const ae = document.activeElement;
    if (ae && ae.classList.contains('card')) {
      e.preventDefault();
      // TV kısayolu: afişi odaklıyken Enter = hızlı oynat (kaldığın yerden/detaydan),
      // "Kütüphaneme ekle" düğmesi görünürse + tuşu da aynı görevde.
      quickPlay(ae.dataset.t, ae.dataset.id, ae);
    }
  }
});
// TV modunda "+" düğmesine erişim: kart üstüne gelince add görünür olur ve Enter önceliği ona geçer
window.addEventListener('keydown', e => {
  if (!tvActive || e.key !== 'Enter') return;
  const ae = document.activeElement;
  if (ae && ae.classList?.contains('add')) { e.preventDefault(); ae.click(); }
}, true);
// Kumandadan ilk ok tuşu gelirse TV gezinme modunu aç (Chrome'da keyCode 0 imzası)
window.addEventListener('keydown', e => { if (/^Arrow/.test(e.key) && (e.keyCode === 0 || e.keyCode === undefined)) tvActive = true; }, true);
// Fareyle tıklayınca gezinme modundan çık (odak halkası fare hover'ıyla karışmasın)
window.addEventListener('mousedown', () => { tvActive = false; }, true);

$('#main').addEventListener('click', e => {
  const nb = e.target.closest('.rnav button');           // satır başı/sonu kaydırma düğmeleri
  if (nb) {
    const sec = nb.closest('.rail'), row = sec?.querySelector('.railrow');
    if (row) {
      const amt = Math.max(240, Math.floor(row.clientWidth * 0.85)) * (+nb.dataset.dir || 1);
      row.scrollBy({ left: amt, behavior: 'smooth' });
    }
    return;
  }
  const c = e.target.closest('.card'); if (!c) return;
  if (e.target.closest('.add')) return toggleLib(c.dataset.id);
  if (e.target.closest('.nm')) return openDetail(c.dataset.t, c.dataset.id);
  if (e.target.closest('.pb')) quickPlay(c.dataset.t, c.dataset.id, c);
});

// Katalog sayfaları tek tek toleranslı çekilir: bir sayfa patlasa bile diğerlerinden içerik gelir.
async function home() {
  setNav('home'); $('#main').innerHTML = '<p class="mute">Yükleniyor…</p>';
  try {
    await loadCatalog();   // kategori (tür) kataloglarını çek → satır başlıkları kategori adları olur
    if (view !== 'home') return;
    renderView();
  } catch (e) { $('#main').innerHTML = `<p class="err">${esc(e.message)}</p><button id="retryHome">Tekrar dene</button>`; $('#retryHome').onclick = home; }
}

// ---------- Keşfet kataloğu: tür bazlı (kategori) sayfalar ----------
const GEN_MAP = [['Action', 'Aksiyon'], ['Adventure', 'Macera'], ['Animation', 'Animasyon'], ['Comedy', 'Komedi'], ['Crime', 'Suç'], ['Documentary', 'Belgesel'], ['Drama', 'Dram'], ['Family', 'Aile'], ['Fantasy', 'Fantastik'], ['History', 'Tarih'], ['Horror', 'Korku'], ['Music', 'Müzik'], ['Mystery', 'Gizem'], ['Romance', 'Romantik'], ['Science Fiction', 'Bilim Kurgu'], ['TV Movie', 'TV Filmi'], ['Thriller', 'Gerilim'], ['War', 'Savaş'], ['Western', 'Vahşi Batı']];
const CATALOG = { loaded: false, tab: 'movie', genres: {} };   // genres: movie/series -> [{ en, tr, ms }]
function dedupe(list) { const s = new Set(); return list.filter(m => m && m.id && !s.has(m.id) && (s.add(m.id), true)); }
async function loadCatalog() {
  if (CATALOG.loaded) return;
  const res = await Promise.allSettled(['movie', 'series'].flatMap(t => GEN_MAP.map(([en]) => px(`${CINE}/catalog/${t}/top/genre=${encodeURIComponent(en)}.json`))));
  let i = 0;
  for (const t of ['movie', 'series']) {
    CATALOG.genres[t] = [];
    for (const [en, tr] of GEN_MAP) {
      const r = res[i++], ms = r.status === 'fulfilled' ? (r.value?.metas || []).map(m => ({ ...m, type: t })) : [];
      if (ms.length) CATALOG.genres[t].push({ en, tr, ms });
    }
  }
  HOME = dedupe(['movie', 'series'].flatMap(t => CATALOG.genres[t].flatMap(g => g.ms)));
  enrichImdb(HOME).then(() => { if (view === 'home') refreshFiltered(); }).catch(() => {});   // puan/yıl eksiklerini arkada tamamla
  CATALOG.loaded = true;
}
function railRows(t) {
  const sortMs = ms => {
    const s = FILTERS.sort;
    if (s === 'rel') return [...ms].sort((a, b) => popOf(b) - popOf(a));
    if (s === 'rating') return [...ms].sort((a, b) => metaRate(b) - metaRate(a));
    if (s === 'year') return [...ms].sort((a, b) => metaYear(b) - metaYear(a));
    if (s === 'az') return [...ms].sort((a, b) => a.name.localeCompare(b.name, 'tr'));
    return ms;
  };
  // Keşfet yıl filtresi: seçili yıl dışındaki içerikler satırlardan çıkarılır.
  const yearOk = m => !FILTERS.year || metaYear(m) === FILTERS.year;
  const groups = [];
  for (const g of CATALOG.genres[t] || []) {
    const ms = sortMs(dedupe(g.ms).filter(yearOk));
    if (ms.length) groups.push({ title: g.tr, ms });
  }
  // Sekme içindeki her içerik en az bir kategori satırında görünsün; başlıklar daima kategori adları.
  const known = new Set(groups.flatMap(x => x.ms.map(m => m.id)));
  const rest = dedupe((CATALOG.genres[t] || []).flatMap(g => g.ms)).filter(m => yearOk(m) && !known.has(m.id));
  for (const m of rest) { const grp = groups.find(x => !x.ms.some(y => y.id === m.id)); if (grp) grp.ms.push(m); }
  return groups;
}
async function search(q) {
  setNav(''); LASTQ = q;
  $('#main').innerHTML = '<p class="mute">Aranıyor…</p>';
  try {
    const e = encodeURIComponent(q);
    const [mv, sr] = await Promise.all([px(`${CINE}/catalog/movie/top/search=${e}.json`), px(`${CINE}/catalog/series/top/search=${e}.json`)]);
    if (view !== '' || LASTQ !== q) return;
    RESULTS = [...(mv.metas || []), ...(sr.metas || [])];
    // Cinemeta meta listelerinde imdb id/puan/year bulunmaz → tek tek tam meta ile tamamla
    await enrichImdb(RESULTS);
    if (view !== '' || LASTQ !== q) return;
    renderView();
    if (FILTERS.minRating > 0) fetchOsMeta(RESULTS);   // puanı hâlâ bilinmeyenler için OpenSubtitles yedeği
  } catch (e) { $('#main').innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}
const ENRICH = {};   // v3uid -> { imdb, imdbRating, year }
const numRate = m => parseFloat(String(m.imdbRating ?? '').replace(',', '.')) || 0;
// Cinemeta "top" kataloğu öğelerinde imdb alanı hiç bulunmaz (sadece imdb_id var) → önce onu doldur.
// Aksi halde osKey boş kalır, OpenSubtitles yedeği çalışmaz ve enrichImdb her öğeyi tek tek meta ile sorgular.
const fillImdbId = list => { for (const m of list) if (!m.imdb && /^tt\d+$/.test(m.id)) m.imdb = m.id; };
async function enrichImdb(list) {
  fillImdbId(list);
  const needMeta = m => !(numRate(m) > 0) || !metaYear(m);   // imdb id artık listede varsayılır
  // Yalnızca sorgulanacak kopyaları tut: nesne ileride değişse de cache'e yanlış kayıt yazılmasın
  const todo = list.filter(m => m.id && needMeta(m) && !(m.id in ENRICH)).map(m => ({ id: m.id, type: m.type }));
  for (const m of list) if (ENRICH[m.id]) backfill(m, ENRICH[m.id]);
  if (!todo.length) return;
  await Promise.all(todo.map(async m => {
    const type = m.type === 'series' ? 'series' : 'movie';
    let rec = null;
    try {
      const d = await px(`${CINE}/meta/${type}/${m.id}.json`);
      const im = String(d.meta?.imdbRating || '').replace(',', '.');
      rec = { imdb: d.meta?.imdb || '', imdbRating: im && parseFloat(im) > 0 ? im : '', year: d.meta?.year || '' };
    } catch { rec = { imdb: '', imdbRating: '', year: '' }; }
    ENRICH[m.id] = rec;
    for (const x of list) if (x.id === m.id) backfill(x, rec);   // yalnızca eksik alanları doldur; katalogdan gelen doğru değerleri ezme
  }));
}
function backfill(m, r) {
  if (r.imdb && !m.imdb) m.imdb = r.imdb;

}
let st;
$('#q').oninput = e => { clearTimeout(st); const v = e.target.value.trim(); st = setTimeout(() => v.length > 1 ? search(v) : (!v && home()), 400); };

// ---------- İçerik filtreleri (arama kutusundan bağımsız; Keşfet + Arama + Kütüphanem) ----------
let RESULTS = [], HOME = [], LIBR = [], LASTQ = '', fOpen = false;
const YEAR_MAX = new Date().getFullYear() + 1, YEAR_MIN = 1900;
const FKEY = 'perde.filters';
const FDEF = () => ({ type: 'all', year: 0, genres: [], minRating: 0, sort: 'rel' });   // year: 0 = tüm yıllar
function loadFilters() {
  try { const s = JSON.parse(localStorage.getItem(FKEY) || 'null'); if (s && typeof s === 'object') return { ...FDEF(), ...s, genres: Array.isArray(s.genres) ? s.genres : [] }; } catch {}
  return FDEF();
}
function savePrefs() {
  try { localStorage.setItem(FKEY, JSON.stringify(FILTERS)); } catch {}
  post('/api/prefs', { filters: FILTERS }).catch(() => {});   // cihazlar arası taşınır
}
let FILTERS = loadFilters();
const OSMETA = {};        // imdb id -> { rating } (Cinemeta'da puan yoksa OpenSubtitles'tan sorgulanır)
let osBusy = 0;
const osKey = m => String(m.imdb || '').replace(/^tt/, '');
const metaYear = m => parseInt(m.year || m.releaseInfo || 0, 10) || 0;
// Popülerlik: Cinemeta katalog kaydındaki popularities/popularity değeri (İlgililik/Popülerlik sıralaması için)

const knownRate = m => { const r = numRate(m); if (r > 0) return r; const om = OSMETA[osKey(m)]; return om && om.rating > 0 ? om.rating : 0; };

async function fetchOsMeta(list) {
  if (!cfg.osQuery) return;
  const todo = [...new Set(list.filter(m => !numRate(m)).map(osKey).filter(id => /^\d+$/.test(id) && !(id in OSMETA)))];
  if (!todo.length) return;
  for (const id of todo) OSMETA[id] = null;   // bekleniyor işareti
  osBusy++; refreshFiltered();
  try {
    for (let i = 0; i < todo.length; i += 40) {
      const chunk = todo.slice(i, i + 40);
      try {
        const { map } = await post('/api/osmeta', { ids: chunk });
        for (const [k, v] of Object.entries(map || {})) OSMETA[k] = v ?? { rating: null };
      } catch {}

    }

function activeFiltCount(f) {

  if (f.genres.length) n++;

  return n;
}
function applyFilters(list) {
  const f = view === 'home' ? { ...FILTERS, type: 'all', genres: [], minRating: 0 } : FILTERS;   // Keşfet'te yalnızca yıl filtresi geçerli (diğer arama filtreleri uygulanmaz)
  if (f.minRating > 0) fetchOsMeta(list);   // puanı eksik içerikler için OpenSubtitles sorgusunu tetikle
  let r = list.filter(m => {
    if (f.type !== 'all' && m.type !== f.type) return false;
    if (f.year) { const y = metaYear(m); if (y !== f.year) return false; }

      return !(OSMETA[osKey(m)] === undefined || OSMETA[osKey(m)] === null);   // yanıt geldi ama puan yok → eleme; soru işaretli → beklemede gizle
    }

const decode = x => { try { return decodeURIComponent(x); } catch { return x; } };

// Bir içerik için son kullanılan kaynak (sürüm adı + kalite) saklanır; afişe tıklayınca yeni listede yeniden bulunur.
const normFp = t => String(t || '').split('\n')[0].replace(/S\d{1,2}E\d{1,3}/ig, 'SxEx').replace(/\b\d{1,2}x\d{1,3}\b/ig, 'SxEx').toLowerCase().trim();

const qOf = s => String(s.name || '').split('\n').slice(1).join(' ').trim().toLowerCase();

  const words = x => new Set(x.split(/[^a-z0-9]+/).filter(Boolean)), lt = words(last.fp);
  let best = null, bs = 0;
  for (const s of list) {
    if (!s.tok) continue;
    const fp = fpOf(s);
    let sc = fp === last.fp ? 2 : 0;
    if (!sc) { const t = words(fp); let n = 0; t.forEach(w => lt.has(w) && n++); sc = n / Math.max(1, new Set([...t, ...lt]).size); if (sc < 0.6) continue; }
    if (qOf(s) === last.q) sc += 0.2;
    if (sc > bs) { bs = sc; best = s; }
  }
  return best;
}
async function quickPlay(type, id, card) {
  const rec = D.progress[id];
  if (!rec?.last || !cfg.addonSet) return openDetail(type, id);     // daha önce kaynak seçilmediyse detay menüsü
  card?.classList.add('busy'); toast('Kaldığınız yerden açılıyor…', 10000);
  try {
    const { meta } = await px(`${CINE}/meta/${type}/${id}.json`);
    const ctx = { type, id, title: meta.name }; let sid = id;
    if (type === 'series') {
      const vids = (meta.videos || []).filter(v => v.season > 0).sort((a, b) => a.season - b.season || a.episode - b.episode);
      ctx.total = vids.length;
      const byTime = Object.entries(rec.eps || {}).sort((a, b) => (b[1].u || 0) - (a[1].u || 0));
      let target = byTime[0]?.[0];
      if (!target) throw new Error('Önce bir bölüm seçin.');
      if (fOf(rec.eps[target]) >= .92) { const i = vids.findIndex(v => `${v.season}:${v.episode}` === target), n = vids[i + 1]; if (n) target = `${n.season}:${n.episode}`; }   // bittiyse sıradaki bölüm
      const [se, ep] = target.split(':').map(Number);
      ctx.ep = { season: se, episode: ep }; sid = `${id}:${se}:${ep}`;
    }
    const data = await j(`/api/streams?type=${type}&sid=${encodeURIComponent(sid)}`);
    const pick = pickStream(data.streams || [], rec.last);
    if (!pick) { toast('Önceki kaynak şu an listede yok, kaynak seçin.', 5000); return openDetail(type, id); }
    ctx.sid = sid;
    $('#toast').style.display = 'none';
    await play(pick, ctx);
  } catch (e) { toast(e.message, 5000); openDetail(type, id); }
  finally { card?.classList.remove('busy'); }
}
async function play(s, ctx, btn) {
  if (!s.tok) return toast('Bu kaynak oynatılamıyor (eklentide AllDebrid ayarlı olmalı).', 6000);
  const rec = D.progress[ctx.id] || (D.progress[ctx.id] = { type: ctx.type, eps: {} });
  rec.type = ctx.type; rec.last = { fp: fpOf(s), q: qOf(s) }; saveData();
  await openPlayer(s.tok, ctx, s);
}

const langName = c => { if (!c) return ''; try { return new Intl.DisplayNames(['tr'], { type: 'language' }).of(c) || c; } catch { return c; } };
const trackName = t => [langName(t.lang) || 'Bilinmiyor', t.title, t.codec + (t.ch ? ' ' + t.ch + 'k' : '')].filter(Boolean).join(' · ');

async function startSession(st, ss, aidx) {
  const v = st.el;
  st.switching = true; $('#stage').classList.add('busy'); st.hls?.destroy(); st.hls = null; clearInterval(st.hb);
  if (st.sid) { stopSid(st.sid); st.sid = null; }
  $('#pinfo').textContent = 'Hazırlanıyor…';
  const r = await post('/api/hls/start', { tok: st.url, ss: Math.floor(ss), aidx });
  if (P !== st) { stopSid(r.id); return; }
  st.sid = r.id; st.trueDur = r.duration || st.trueDur; st.offset = r.start ?? Math.floor(ss); st.aidx = r.aidx; st.gen = r.gen || 0;
  const want = Math.max(0, ss - st.offset);                     // istenen nokta ile anahtar kare arasındaki fark
  fillTracks(st, r.audios, r.subs);
  const pl = `/hls/${r.id}/index.m3u8`;
  const forceHls = new URLSearchParams(location.search).get('engine') === 'hls';   // Safari'nin kendi HLS oynatıcısı yerine hls.js
  st.want = want > 0.5 ? want : 0; st.wantDone = !st.want; st.wantTries = 0;

    const h = new Hls({ startPosition: want > 0.5 ? want : 0, maxBufferLength: 30 });
    h.on(Hls.Events.ERROR, (e, d) => { dbg(`hls.js hata: ${d.details} fatal=${d.fatal}`); if (d.fatal) toast('Oynatma hatası: ' + d.details, 8000); });
    h.loadSource(pl); h.attachMedia(v); st.hls = h;
  }
  v.play().catch(() => {});
  applySub(st); ensureSubs(st);
  $('#pinfo').textContent = st.dispTxt;
  st.hb = setInterval(() => post('/api/hls/pos', { id: st.sid, pos: v.currentTime }).then(r => { if (P === st && r.gen) st.gen = r.gen; }).catch(() => {}), 2000);
}
// İstenen saniyeye (anahtar kareden sonraki fark ya da kayıtlı konum) tarayıcı hazır olunca atlar; tutmazsa birkaç kez dener.
function ensureWant(st) {
  if (st.wantDone || !st.want) return;
  const v = st.el;
  if (Math.abs(v.currentTime - st.want) < 1.5) { st.wantDone = true; return; }

}

  const v = st.el; t = Math.min(Math.max(0, t), (st.trueDur || v.duration || 1e9) - 1);

  if (rel >= 0 && rel <= st.gen - 2) v.currentTime = rel;                       // hazır bölüm içinde: anında
  else startSession(st, t, st.aidx).catch(e => toast(e.message, 6000));     // değilse: o noktadan yeni oturum

      openPlayer(url, ctx, s, true, { at: absT(), aidx: st.aidx });
    }, { once: true });
    v.src = '/api/direct?t=' + url;                         // sunucu nihai adrese yönlendirir (video doğrudan CDN'den akar)
    post('/api/probe', { tok: url }).then(r => { if (P === st) { st.trueDur = r.duration || 0; fillTracks(st, r.audios, r.subs); } }).catch(() => { if (P === st) { st.embLoaded = true; autoSub(st); } });   // ffmpeg yoksa sessizce atlanır
    return;
  }
  try { await startSession(st, start, opt.aidx); }
  catch (e) { if (P === st) { st.switching = false; $('#stage').classList.remove('busy'); subMsg(e.message, true); toast(e.message, 8000); } }
}
// --- Tam ekran çıkış yardımcıları: Safari'de yarım kalan fullscreen geçişi + DOM silinmesi tüm sayfayı kilitleyebiliyordu.
const fsOn = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function exitFsSafe() {                                   // promise reddini (zaten ekrandaysan) yut; senkron hatayı da yakala
  try {
    const p = (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
    p?.catch?.(() => {});
  } catch {}
}
let fsExitT = null;
function leaveFs() {                                       // tam ekrandan çıkışı en fazla ~500 ms içinde garanti et
  if (!fsOn()) return;
  exitFsSafe();
  clearTimeout(fsExitT);
  fsExitT = setTimeout(() => { if (fsOn()) exitFsSafe(); }, 200);   // WebKit ilk çağrıyı bazen yutar: bir kez daha dene
}
let playerClosing = false;
async function closePlayer() {
  if (playerClosing) return;                               // çift tıklama/ardışık çağrı: ikinci geçişi başlatıp Safari'de kilit yaratmasın
  playerClosing = true;
  try {
    leaveFs();                                             // önce ekrandan çık (video elementine dokunmadan): Safari'de ana iş parçacığını kilitleyen şey, DOM silinirken yarım kalan fullscreen geçişiydi
    const until = Date.now() + 500;                        // tam ekrandan çıkışı EN FAZLA 500 ms bekle; gecikirse yine de temizle (sonsuz bekleme yok)
    while (fsOn() && Date.now() < until) await new Promise(r => setTimeout(r, 40));
    stopPlayback(); sheet('#player', false); persistNow(); refreshBars();   // X ile kapatınca konum anında sunucuya yazılır (debounce beklemeden)
  } finally {
    setTimeout(() => { playerClosing = false; }, 300);     // çıkış olayları oturana kadar kilitli kal
  }
}

// --- Kontroller ---
let idleT;
function wake() {
  const box = $('#fsbox'); box.classList.remove('idle'); clearTimeout(idleT);
  if (P && !P.el.paused) idleT = setTimeout(() => { box.classList.add('idle'); }, 3000);   // 3 sn hareketsizlikte kontroller gizlenir; fare/hareket geri getirir
}
['mousemove', 'pointerdown', 'touchstart'].forEach(ev => $('#fsbox').addEventListener(ev, wake, { passive: true }));
document.addEventListener('mousemove', () => { if (P && !P.el.paused && $('#player').classList.contains('open')) wake(); }, { passive: true });   // masaüstü: imleç hareketi de kontrolleri uyandırır
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => { $('#fsbox').classList.toggle('fs', fsOn()); updFsBtn(); wake(); }));
const updFsBtn = () => { $('#cFs').textContent = fsOn() ? '🗖' : '⛶'; };
function enterFs() {
  const box = $('#fsbox');
  const req = box.requestFullscreen || box.webkitRequestFullscreen;
  if (req) { try { const p = req.call(box); p?.catch?.(() => {}); } catch {} } else P?.el.webkitEnterFullscreen?.();
}
function toggleFs() {
  if (fsOn()) {                                            // çıkışta da reddedilen promise ana iş parçacığını bloklamasın
    try {
      const ex = document.exitFullscreen || document.webkitExitFullscreen;
      const p = ex?.call(document);
      if (p && typeof p.catch === 'function') p.catch(() => {});
    } catch {}
    return;
  }
  enterFs();
}
$('#stage').addEventListener('click', e => {          // video alanına tek tık: oynat-duraklat (çift tık: tam ekran)
  if (e.target.closest('.ovl')) return;
  if (dblT) { clearTimeout(dblT); dblT = null; toggleFs(); return; }
  dblT = setTimeout(() => { dblT = null; if (P) (P.el.paused ? P.el.play() : P.el.pause()); }, 260);
});
let dblT = null;
const updPlayBtn = () => { $('#cPlay').textContent = P && !P.el.paused ? '❚❚' : '▶'; };
$('#cPlay').onclick = () => P && (P.el.paused ? P.el.play() : P.el.pause());
$('#cBack').onclick = () => P && seekTo(absT() - 10);
$('#cFwd').onclick = () => P && seekTo(absT() + 10);
$('#cMute').onclick = () => { if (P) { P.el.muted = !P.el.muted; $('#cMute').textContent = P.el.muted ? '🔇' : '🔈'; } };
$('#cFs').onclick = toggleFs;
$('#cSeek').oninput = e => { if (!P) return; P.drag = true; $('#cTime').textContent = fmt(e.target.value / 1000 * P.trueDur) + ' / ' + fmt(P.trueDur); };
$('#cSeek').onchange = e => { if (!P) return; P.drag = false; seekTo(e.target.value / 1000 * P.trueDur); };
$('#audSel').onchange = e => {
  const st = P; if (!st) return;
  const idx = +e.target.value, at = absT();
  if (st.sid) startSession(st, at, idx).catch(err => toast(err.message, 6000));
  else if (idx !== st.defAidx) openPlayer(st.url, st.ctx, st.s, true, { at, aidx: idx });   // doğrudan modda ses değişimi: sunucu paketlemesine geç
};
window.addEventListener('pagehide', () => { if (P?.sid) stopSid(P.sid); });
document.addEventListener('keydown', e => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) && e.target.type !== 'range') return;
  const open = $('#player').classList.contains('open');
  if (e.key === 'Escape') {
    if (document.fullscreenElement || document.webkitFullscreenElement) { leaveFs(); return; }   // Safari'de geç kalan çıkışı tamamla
    if (open) return closePlayer();
    if ($('#detail').classList.contains('open')) sheet('#detail', false);
    return;
  }
  if (!open || !P || e.metaKey || e.ctrlKey || e.altKey) return;
  wake();
  if (e.key === ' ' && e.target.tagName !== 'BUTTON') { e.preventDefault(); P.el.paused ? P.el.play() : P.el.pause(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); seekTo(absT() - 10); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); seekTo(absT() + 10); }
  else if (e.key === 'f') toggleFs();
  else if (e.key === 'm') $('#cMute').click();
});
$('#closeP').onclick = closePlayer;
$('#iina').onclick = () => curUrl ? location.href = 'iina://weblink?url=' + encodeURIComponent(curUrl) : toast('Bağlantı hazırlanıyor, birkaç saniye sonra deneyin.');
const isMac = /Mac/.test(navigator.platform) && !(navigator.maxTouchPoints > 1);
if (!isMac) $('#iina').style.display = 'none';
$('#vlc').onclick = () => curUrl ? location.href = 'vlc://' + curUrl : toast('Bağlantı hazırlanıyor, birkaç saniye sonra deneyin.');
$('#dl').onclick = () => {
  const st = P; if (!st) return toast('Önce bir içerik oynatın.');
  // Sunucu köprüsü (/api/download): dosya içeriği sunucudan bu cihaza akar → indirme tarayıcının
  // "İndirilenler"ine düşer. Doğrudan linkte CDN genelde Content-Disposition dönmediğinden
  // "kopyala" gibi davranıp sekme açabiliyordu; bu yöntem her cihazda (TV dahil) gerçek indirmeyi garanti eder.
  const fname = (st.ctx.title || 'video') + (st.ctx.ep ? ` S${st.ctx.ep.season}E${st.ctx.ep.episode}` : '') + '.mp4';
  const a = document.createElement('a');
  a.href = '/api/download?t=' + encodeURIComponent(st.url) + '&name=' + encodeURIComponent(fname);
  a.download = fname;
  a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  toast('İndirme başladı — oynatılan cihazın indirilenler klasörüne kaydediliyor.');
};

// ---------- Hesap, ayarlar, kullanıcılar ----------

    ${admin ? `<h2 style="margin-top:2rem">Sunucu ayarları</h2>
    <p class="mute">Bilgiler yalnızca bu bilgisayardaki config.json dosyasında saklanır ve tüm kullanıcılar için geçerlidir. Kullanıcılar bu adresleri göremez.</p>
    <label for="f_addon">Kaynak eklentisi (AIOStreams manifest adresi)</label><input id="f_addon" value="${esc(cfg.addon)}" placeholder="https://aiostreams.elfhosted.com/stremio/…/manifest.json" autocomplete="off">

    <label for="f_osu">OpenSubtitles kullanıcı adı</label><input id="f_osu" value="${esc(cfg.osUser)}" autocomplete="off">
    <label for="f_osp">OpenSubtitles parolası</label><input id="f_osp" type="password" autocomplete="off" placeholder="${cfg.osSet ? '(kayıtlı)' : ''}">
    <label for="f_lang">Altyazı dilleri (virgülle)</label><input id="f_lang" value="${esc(cfg.langs)}" placeholder="tr,en">
    <div class="row"><button class="primary" id="save">Kaydet</button><button id="tAddon">Eklentiyi sına</button></div><p id="sres"></p>` : ''}</div>`;
  const out = (id, m, bad) => { $(id).textContent = m; $(id).className = bad ? 'err' : ''; };
  $('#chpw').onclick = async () => {

    catch (e) { out('#pres', e.message, true); }
  };
  if (!admin) return;
  $('#save').onclick = async () => {
    try { cfg = { ...cfg, ...await post('/api/config', { addon: $('#f_addon').value, osKey: $('#f_oskey').value, osUser: $('#f_osu').value, osPass: $('#f_osp').value, langs: $('#f_lang').value }) }; toast('Kaydedildi'); settings(); }
    catch (e) { out('#sres', e.message, true); }
  };
  $('#tAddon').onclick = async () => {
    try { const m = await post('/api/addon/test', { url: $('#f_addon').value }); out('#sres', `Bağlandı: ${m.name || 'eklenti'} ${m.version || ''}`); }
    catch (e) { out('#sres', e.message, true); }
  };
}
async function usersView() {
  setNav('usr');
  $('#main').innerHTML = '<p class="mute">Yükleniyor…</p>';
  try {
    const list = await j('/api/users');
    $('#main').innerHTML = `<div style="max-width:720px"><h2>Kullanıcılar</h2>
      <p class="mute">Her kullanıcının kütüphanesi ve izleme ilerlemesi ayrıdır. Yalnızca güvendiğiniz kişileri ekleyin.</p>
      <div class="list" id="ulist">${list.map(u => `<div class="item" style="align-items:center;flex-wrap:wrap" data-id="${esc(u.id)}"><span><b>${esc(u.name)}</b> <small>${u.role === 'admin' ? 'Yönetici' : 'Kullanıcı'}${u.id === me.id ? ' · siz' : ''}</small></span>
        <span class="row" style="margin:0"><button data-a="pw">Parola belirle</button><button data-a="role">${u.role === 'admin' ? 'Kullanıcı yap' : 'Yönetici yap'}</button>${u.id === me.id ? '' : '<button data-a="del">Sil</button>'}</span></div>`).join('')}</div>
      <h3 style="margin-top:1.6rem">Yeni kullanıcı</h3>
      <label for="u_name">Kullanıcı adı</label><input id="u_name" autocomplete="off">
      <label for="u_pw">Parola (en az 6 karakter)</label><input id="u_pw" type="password" autocomplete="new-password">
      <label for="u_role">Rol</label><select id="u_role"><option value="user">Kullanıcı</option><option value="admin">Yönetici</option></select>
      <div class="row"><button class="primary" id="u_add">Ekle</button></div><p id="ures"></p></div>`;
    const err = e => { $('#ures').textContent = e.message; $('#ures').className = 'err'; };

    $$('#ulist [data-a]').forEach(b => b.onclick = () => {
      const row = b.closest('[data-id]'), id = row.dataset.id, u = list.find(x => x.id === id);
      if (b.dataset.a === 'pw') { const pw = prompt(`${u.name} için yeni parola (en az 6 karakter):`); if (pw) post('/api/users/update', { id, password: pw }).then(() => toast('Parola değiştirildi')).catch(err); }
      else if (b.dataset.a === 'role') post('/api/users/update', { id, role: u.role === 'admin' ? 'user' : 'admin' }).then(usersView).catch(err);
      else if (confirm(`${u.name} silinsin mi? Kütüphanesi ve izleme geçmişi de silinir.`)) post('/api/users/delete', { id }).then(usersView).catch(err);
    });
  } catch (e) { $('#main').innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}
const menu = $('#menu'), menuBtn = $('#menuBtn');
const closeMenu = () => { menu.classList.remove('open'); menuBtn.setAttribute('aria-expanded', 'false'); };
menuBtn.onclick = e => { e.stopPropagation(); const o = menu.classList.toggle('open'); menuBtn.setAttribute('aria-expanded', String(o)); };
menu.addEventListener('click', e => { if (e.target.closest('button')) closeMenu(); });
document.addEventListener('click', e => { if (!e.target.closest('#menu, #menuBtn')) closeMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

/* ---- Android TV: kumanda kısayol tuşları + renk teması ---- */
const tvTheme = () => { try { const r = document.documentElement.style; r.setProperty('--lamp', '#45d0ff'); r.setProperty('--red', '#ff3b5c'); } catch {} };
if (tvMode()) tvTheme();
window.addEventListener('keydown', e => {
  if (!tvActive && !tvMode()) return;
  // Yeşil tuş (Android TV remote): Green / F1 / MediaGreen → Kütüphaneme ekle/çıkar
  if (e.key === 'Green' || e.key === 'F1' || e.keyCode === 172 || e.code === 'MediaGreen') {
    const card = document.activeElement?.closest?.('.card') || document.activeElement;
    const id = card?.dataset?.id;
    if (id) { e.preventDefault(); toggleLib(id); }
    return;
  }
  // Mavi tuş (Blue / F2 / MediaBlue): TV tema renkleri (amber yerine açık mavi vurgu)
  if (e.key === 'Blue' || e.key === 'F2' || e.keyCode === 173 || e.code === 'MediaBlue') { e.preventDefault(); tvTheme(); return; }
  // Geri tuşları (Backspace, Escape, GoBack, KeyboardGoBack, MediaBack): sırasıyla oynatıcı → detay → menü → arama kutusu
  if (['Backspace', 'Escape', 'GoBack', 'KeyboardGoBack'].includes(e.key) || e.keyCode === 166) {
    if ($('#player').classList.contains('open')) { e.preventDefault(); closePlayer(); return; }
    if ($('#detail').classList.contains('open')) { e.preventDefault(); sheet('#detail', false); return; }
    if (menu.classList.contains('open')) { e.preventDefault(); closeMenu(); return; }
    if (document.activeElement === $('#q')) { e.preventDefault(); $('#q').blur(); return; }
  }
}, true);
const flushData = () => { if (!me) return; try { persistNow(); } catch {} };   // keepalive fetch: Safari dahil kapanış/yenileme anında ulaşır
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (P) saveProgress(P); flushData(); } });
window.addEventListener('pagehide', () => { if (P) saveProgress(P); flushData(); });
$('#logout').onclick = async () => { try { await post('/api/logout', {}); } catch {} location.href = '/login'; };

(async () => {
  [me, cfg, D] = await Promise.all([j('/api/me'), j('/api/config'), j('/api/data')]);
  D.library = D.library || []; D.progress = D.progress || {};

  try {
    const p = await j('/api/prefs');
    if (!localStorage.getItem(FKEY) && p && p.filters && typeof p.filters === 'object') FILTERS = { ...FDEF(), ...p.filters, genres: Array.isArray(p.filters.genres) ? p.filters.genres : [] };
  } catch {}
  (cfg.addonSet || me.role !== 'admin') ? home() : settings();
})();
